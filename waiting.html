<!-- ==============================================================
     BODY1ST 개인 대기 페이지
     알림톡 버튼이 이 페이지로 연결됩니다.
       https://도메인/waiting?key=xxxxx
     key 가 없으면 예시 데이터로 미리보기가 표시되고,
     key 가 유효하지 않으면(만료·취소) 안내 문구가 표시됩니다.

     ▼ 아래 <script> 맨 위 CONFIG 에서 강의 영상·문의처 등을 설정하세요.
     ============================================================== -->

<style>
:root{
  --pt   : #BF134B;
  --pt-d : #9C0F3D;
  --ink  : #17181A;
  --txt  : #2C2E31;
  --mut  : #7A7E84;
  --line : #E6E7E9;
  --bg2  : #F7F7F5;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg2); color:var(--txt);
  font-family:"Noto Sans KR","Helvetica Neue",Helvetica,Arial,sans-serif;
  word-break:keep-all; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px; margin:0 auto; padding:28px 18px 60px;}

/* 헤더 */
.hdr{background:#fff; border-bottom:1px solid var(--line);}
.hdr .in{max-width:640px; margin:0 auto; padding:16px 18px; display:flex; align-items:center;}
.hdr img{display:block; height:30px; width:auto;}

.card{background:#fff; border:1px solid var(--line); border-radius:16px; margin-bottom:16px;}

/* 대기 순번 */
.rank{padding:40px 24px; text-align:center;}
.rank p{margin:0; font-size:16px; font-weight:500; color:var(--txt);}
.rank .no{
  display:block; margin:14px 0 6px; font-size:64px; font-weight:900;
  color:var(--pt); letter-spacing:-3px; line-height:1;
}
.rank .no.loading{color:#D6D8DA; font-size:44px; letter-spacing:2px;}
.rank .unit{font-size:18px; font-weight:700; color:var(--ink);}
.rank .meta{
  margin-top:22px; padding-top:18px; border-top:1px solid var(--line);
  display:flex; justify-content:center; gap:28px; flex-wrap:wrap;
  font-size:14px; color:var(--mut);
}
.rank .meta b{display:block; margin-top:4px; font-size:17px; color:var(--ink); font-weight:700;}

/* 강의 */
.lec{border:2px solid var(--pt); padding:22px 22px 26px; position:relative;}
.lec .badge{
  display:inline-block; background:var(--pt); color:#fff; font-size:13.5px; font-weight:700;
  padding:8px 16px; border-radius:8px; margin-bottom:16px;
}
.video{
  position:relative; width:100%; aspect-ratio:16/9; background:#000;
  border-radius:8px; overflow:hidden;
}
.video iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.video .ph{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  text-align:center; color:#8A8F95; font-size:14px; line-height:1.8; padding:20px;
  background:#232427;
}
.lec .cap{margin:16px 0 0; text-align:center; font-size:15px; color:var(--txt); font-weight:500;}
.lec .task{
  margin:18px 0 0; background:var(--bg2); border-radius:10px; padding:16px 18px;
  font-size:14.5px; line-height:1.8; color:var(--txt);
}
.lec .task b{color:var(--ink);}

/* 성과 티커 */
.ticker{overflow:hidden; margin-bottom:16px;}
.ticker-in{display:flex; gap:10px; width:max-content; animation:roll 32s linear infinite;}
.ticker span{
  background:#fff; border:1px solid var(--line); border-radius:999px;
  padding:9px 18px; font-size:13.5px; color:var(--pt); font-weight:700; white-space:nowrap;
}
.ticker span em{font-style:normal; color:var(--mut); font-weight:400; margin:0 6px;}
@keyframes roll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* 바로가기 */
.links{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;}
.links a, .links button{
  display:block; width:100%; background:#fff; border:1px solid var(--line); border-radius:14px;
  padding:22px 8px; text-align:center; text-decoration:none; cursor:pointer;
  font-family:inherit; font-size:14.5px; font-weight:700; color:var(--ink);
}
.links a:hover, .links button:hover{border-color:var(--ink);}
.links .ic{display:block; font-size:22px; margin-bottom:8px;}

/* FAQ */
.faq{padding:26px 24px 10px;}
.faq h2{margin:0 0 18px; font-size:18px; font-weight:900; color:var(--ink);}
.faq dl{margin:0;}
.faq dt{
  font-size:15.5px; font-weight:700; color:var(--ink); line-height:1.6;
  padding-left:14px; position:relative;
}
.faq dt::before{content:"·"; position:absolute; left:0; color:var(--pt); font-weight:900;}
.faq dd{
  margin:8px 0 0 14px; font-size:14.5px; line-height:1.85; color:var(--mut);
  padding-bottom:18px; border-bottom:1px solid var(--line);
}
.faq dd:last-of-type{border-bottom:0;}
.faq dt + dd + dt{margin-top:18px;}

/* 상태 안내 */
.notice{padding:56px 24px; text-align:center;}
.notice .ic{font-size:40px; display:block; margin-bottom:16px;}
.notice h2{margin:0 0 12px; font-size:20px; font-weight:900; color:var(--ink);}
.notice p{margin:0 0 24px; font-size:15px; line-height:1.85; color:var(--mut);}
.btn{
  display:inline-block; background:var(--pt); color:#fff; text-decoration:none;
  font-weight:700; font-size:16px; padding:16px 34px; border-radius:8px;
  border:0; cursor:pointer; font-family:inherit;
}
.btn:hover{background:var(--pt-d);}

.foot{text-align:center; font-size:13px; color:var(--mut); line-height:1.9; padding:10px 0 0;}
.hide{display:none !important;}

@media (max-width:520px){
  .rank{padding:32px 18px;}
  .rank .no{font-size:52px;}
  .links{grid-template-columns:repeat(2,1fr);}
  .links a, .links button{padding:15px 8px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px;}
  .links .ic{margin:0; font-size:18px;}
}
</style>
</head>

      <span class="badge" id="lecBadge">1회차 특별 무료 강의</span>
      <div class="video" id="video"></div>
      <p class="cap">대기 기간 동안만 제공되는 강의입니다. 지금 바로 시청하세요.</p>
      <div class="task" id="task"></div>
    </div>

    <div class="ticker hide" id="ticker"><div class="ticker-in" id="tickerIn"></div></div>

    <div class="links">
      <a id="link1" href="#"><span class="ic">📘</span>교육과정 안내</a>
      <a id="link2" href="#"><span class="ic">💬</span>문의하기</a>
    </div>

    <div class="card faq">
      <h2>자주 묻는 질문</h2>
      <dl id="faq"></dl>
    </div>

    <p class="foot" id="foot"></p>
  </div>

  <!-- 오류 / 안내 화면 -->
  <div id="notice" class="card notice">
    <span class="ic" id="nIcon">⏳</span>
    <h2 id="nTitle">확인 중입니다</h2>
    <p id="nText">잠시만 기다려 주세요.</p>
    <a class="btn hide" id="nBtn" href="#">랜딩페이지로 이동</a>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ================= CONFIG ================= */
  var CONFIG = {
    // 구글 Apps Script 웹앱 URL (랜딩페이지와 동일한 주소)
    endpoint: "https://script.google.com/macros/s/AKfycbzCQvXUyPGJw_RBK7v_r-Zj9bkC6j6HSHiJPVfjEaMftSPrkZ8q0sktV8ZUeB2Go_6u/exec",

    // 랜딩페이지 주소 (오류 화면 / 재신청 버튼용)
    landingUrl: "https://seangrim84-hue.github.io/body1st/",

    lectureBadge: "1회차 특별 무료 강의",

    /* 강의 영상
       - youtubeId : 유튜브 영상 ID (일부공개 영상 권장)
       - embedUrl  : 유튜브가 아닌 경우 임베드 주소를 직접 지정
       - 둘 다 비워두면 '준비 중' 자리표시자가 표시됩니다.        */
    youtubeId: "4KKALkjY80o",
    embedUrl:  "",

    // 강의 아래 과제 안내 (비워두면 숨김)
    taskHtml:
      "<b>1회차 특별 무료 강의 수강 과제</b><br>" +
      "강의를 보신 후, 본인 또는 회원님의 전신 전면·후면·측면 사진을 찍어 " +
      "체형 분석 포인트 3가지를 적어보세요.",

    // 바로가기 버튼
    link1: { label: "교육과정 안내", url: "https://seangrim84-hue.github.io/body1st/#program" },
    link2: { label: "문의하기",      url: "https://pf.kakao.com/_xdwCLM" },

    /* 수료생 성과 티커 — 실제 데이터만 넣으세요. 비워두면 표시되지 않습니다.
       예) { name: "김O연", detail: "16기 수료", result: "센터 프로그램 운영 중" } */
    ticker: [],

    faq: [
      { q: "연락은 언제 오나요?",
        a: "모집이 시작되면 신청하신 번호로 일정과 신청 방법을 안내드립니다." },
      { q: "대기 순번을 다른 사람에게 넘길 수 있나요?",
        a: "순번 양도는 불가합니다." },
      { q: "이 강의는 언제까지 볼 수 있나요?",
        a: "대기 기간 동안 언제든 이 링크로 다시 들어와 보실 수 있습니다. 안내 메시지를 지우지 마시고 보관해 주세요." },
      { q: "교육은 어디에서 진행되나요?",
        a: "체형분석 운동지도자과정 입문자교육은 온라인 100% 강좌로 " +
           "바디퍼스트ON(<a href=\"https://www.bofiron.com\" target=\"_blank\" rel=\"noopener\">www.bofiron.com</a>)에서 진행됩니다." }
    ],

    footText: "문의 070-7722-7899 · 010-2855-4268<br>" +
              "카카오톡 채널 @body1st<br>© BODY1ST"
  };
  /* ========================================== */

  var $ = function(id){ return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var key    = params.get("key");

  /* ---------- 미리보기 모드 ----------
     아래 세 경우에 서버 조회 없이 예시 데이터로 화면을 보여줍니다.
       1) 주소 끝에 ?preview=1
       2) 파일을 그대로 연 경우(file://)
       3) key 가 없는 경우 — 알림톡 심사자가 버튼 URL을 직접 여는 상황.
          이때 잠금 화면 대신 강의가 보여야 심사에서 확인이 됩니다.
     key 가 있는데 유효하지 않은 경우(만료·취소)는 기존 안내 화면이 그대로 뜹니다. */
  /* 접속키는 40자 랜덤 문자열입니다.
     그 형식이 아니면(빈 값, 또는 치환되지 않은 "#{key}" 같은 자리표시자)
     서버에 묻지 않고 미리보기로 처리합니다.
     심사자가 버튼 URL을 그대로 열면 브라우저에 따라
     key 가 빈 값이 되기도 하고 "#{key}" 문자열이 들어오기도 합니다. */
  var NOKEY   = !key || !/^[A-Za-z0-9_-]{32,}$/.test(key);
  var PREVIEW = params.get("preview") === "1" || location.protocol === "file:" || NOKEY;

  var PREVIEW_DATA = {
    name: "김바디", waitingNumber: 208, totalWaitingCount: 208,
    expectedWaitDays: 15, daysLeft: 6
  };

  function showNotice(icon, title, text, btnLabel, btnUrl){
    $("main").classList.add("hide");
    $("notice").classList.remove("hide");
    $("nIcon").textContent  = icon;
    $("nTitle").textContent = title;
    $("nText").innerHTML    = text;
    var b = $("nBtn");
    if(btnLabel){ b.textContent = btnLabel; b.href = btnUrl || CONFIG.landingUrl; b.classList.remove("hide"); }
    else b.classList.add("hide");
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  /* ---------- Apps Script 호출 (JSONP) ---------- */
  function call(action, cb){
    var fn = "b1w_" + Math.random().toString(36).slice(2, 10),
        s  = document.createElement("script"),
        done = false;

    function cleanup(){
      try{ delete window[fn]; }catch(e){ window[fn] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    window[fn] = function(res){ done = true; cleanup(); cb(res); };
    s.onerror = function(){ if(!done){ done = true; cleanup(); cb(null); } };
    setTimeout(function(){ if(!done){ done = true; cleanup(); cb(null); } }, 8000);

    s.src = CONFIG.endpoint + "?action=" + action +
            "&key=" + encodeURIComponent(key || "") + "&callback=" + fn;
    document.body.appendChild(s);
  }

  /* ---------- 화면 그리기 ---------- */
  function render(d){
    $("notice").classList.add("hide");
    $("main").classList.remove("hide");

    $("uname").textContent = d.name;
    var no = $("rankNo");
    no.textContent = Number(d.waitingNumber).toLocaleString();
    no.classList.remove("loading");
    $("total").textContent = Number(d.totalWaitingCount).toLocaleString() + "명";
    $("days").textContent  = "약 " + d.expectedWaitDays + "일";

    // 강의 영상
    $("lecBadge").textContent = CONFIG.lectureBadge;
    var v = $("video");
    var src = CONFIG.embedUrl ||
      (CONFIG.youtubeId ? "https://www.youtube.com/embed/" + CONFIG.youtubeId + "?rel=0" : "");
    v.innerHTML = src
      ? '<iframe src="' + src + '" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'
      : '<div class="ph">강의 영상이 준비되는 대로<br>이 자리에 표시됩니다.</div>';

    // 과제
    if(CONFIG.taskHtml) $("task").innerHTML = CONFIG.taskHtml;
    else $("task").classList.add("hide");

    // 바로가기
    $("link1").href = CONFIG.link1.url;
    $("link1").innerHTML = '<span class="ic">📘</span>' + esc(CONFIG.link1.label);
    $("link2").href = CONFIG.link2.url;
    $("link2").innerHTML = '<span class="ic">💬</span>' + esc(CONFIG.link2.label);

    // 성과 티커 (데이터가 있을 때만)
    if(CONFIG.ticker && CONFIG.ticker.length){
      var html = CONFIG.ticker.map(function(t){
        return '<span>' + esc(t.name) + '<em>|</em>' + esc(t.detail) +
               '<em>|</em>' + esc(t.result) + '</span>';
      }).join("");
      $("tickerIn").innerHTML = html + html;      // 무한 루프용 2벌
      $("ticker").classList.remove("hide");
    }

    // FAQ
    $("faq").innerHTML = CONFIG.faq.map(function(f){
      // 질문은 이스케이프, 답변은 링크 표기를 위해 HTML 허용 (CONFIG 는 직접 작성한 값입니다)
      return '<dt>' + esc(f.q) + '</dt><dd>' + f.a + '</dd>';
    }).join("");

    $("foot").innerHTML = CONFIG.footText;
  }

  /* ---------- 시작 ---------- */
  if(PREVIEW){
    render(PREVIEW_DATA);
    var tag = document.createElement("div");
    tag.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99;background:#17181A;" +
      "color:#fff;font-size:13px;text-align:center;padding:10px;font-weight:500;";
    tag.textContent = NOKEY
      ? "대기 순번은 예시입니다. 안내 메시지의 링크로 접속하시면 회원님의 실제 순번이 표시됩니다."
      : "미리보기 모드 — 예시 데이터입니다. 실제 서비스에서는 신청자 본인의 정보가 표시됩니다.";
    document.body.appendChild(tag);
    document.querySelector(".wrap").style.paddingBottom = "80px";
    return;
  }

  call("verify", function(res){
    if(!res){
      showNotice("⚠️", "연결에 실패했습니다.",
        "네트워크 상태를 확인하시고 다시 시도해 주세요.");
      return;
    }
    if(res.status === "success"){ render(res.data); return; }

    if(res.code === "EXPIRED")
      showNotice("⏰", "링크 유효기간이 지났습니다.",
        "안내 링크는 발송일로부터 7일간 유효합니다.<br>다시 신청하시면 새 링크를 보내드립니다.",
        "다시 대기신청하기", CONFIG.landingUrl);
    else if(res.code === "CANCELLED")
      showNotice("✕", "취소된 신청입니다.",
        "다시 신청하고 싶으시면 아래 버튼을 눌러주세요.",
        "다시 대기신청하기", CONFIG.landingUrl);
    else
      showNotice("🔒", "신청 내역을 찾을 수 없습니다.",
        "안내 문자로 받으신 링크를 그대로 눌러주세요.", "랜딩페이지로 이동");
  });
})();
</script>
</body>
</html>
